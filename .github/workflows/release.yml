name: Build & Release V2

on:
  push:
    tags:
      - 'V2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Android APK
        run: |
          cd android && ./gradlew assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/*.apk
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V2
          name: "Calculator V2: Exact Values & Enhanced Matrix Tools"
          body: |
            ### 🚀 New Features
            *   **Exact Math Engine**: Trigonometric functions now return exact values (fractions/roots) alongside decimals.
            *   **Advanced Matrix Tools**:
                *   New size presets: 2×2, 3×3, 4×4.
                *   Dual-mode output: See results in both decimal and fractional forms.
            *   **Extended Stats**: Enhanced "1-Var Stats" interface with data persistence.
            *   **Expanded Functions**: Added Inverse Tangent (tan⁻¹) support.

            ### 🛠 Improvements
            *   Cleaner UI state handling for Statistics and Matrix modes.
            *   Better result formatting for complex calculations.
          files: "android/app/build/outputs/apk/release/*.apk"
