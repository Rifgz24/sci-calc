name: Build & Release V2

on:
  push:
    tags:
      - 'V2'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli@latest

      - name: Sync web assets to Android
        run: npx cap copy android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 || echo '')
          if [ -z "$PREV_TAG" ]; then
            echo "body=$(git log --pretty=format:"- %s (%h)" HEAD)" >> $GITHUB_OUTPUT
          else
            echo "body=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" )" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V2
          name: V2 Release
          body: ${{ steps.changelog.outputs.body }}
          files: android/app/build/outputs/apk/release/*.apk
